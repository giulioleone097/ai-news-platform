version: 2
updates:
  # One grouped pull request a week per ecosystem, so security fixes such as a Next.js advisory
  # arrive without a manual audit. Major versions stay manual: they need the full gate and a review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
