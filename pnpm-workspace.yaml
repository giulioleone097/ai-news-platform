packages:
  - apps/*
  - packages/*

# Fail the install on a peer dependency that does not match, instead of resolving around it.
strictPeerDependencies: true

# Dependency lifecycle scripts run only when listed here with `true`. Every package below ships a
# script and every one is denied on purpose, so a new script-running dependency fails the install
# until someone decides:
#   esbuild        postinstall only swaps the JS launcher for the native binary (speed); tsx, vite
#                  and vinext load the binary from the @esbuild/<platform> package either way
#   sharp          install falls back to `npm run build` (node-gyp); the prebuilt @img/* packages
#                  are present for the platforms we use, so the script never needs to run
#   unrs-resolver  postinstall only verifies the prebuilt @unrs/* binding (eslint resolver)
#   workerd        postinstall only links the native binary (wrangler finds it either way)
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  workerd: false
