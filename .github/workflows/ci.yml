name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No version input: the action installs the pnpm pinned by "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate design system
        run: pnpm run design:lint && pnpm run design:tokens:check

      - name: Validate agent plugin
        run: pnpm run plugin:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build production bundle
        run: pnpm run build

      - name: Build ChatGPT Sites artifact
        run: pnpm run build:sites

      # Measures both builds, so it runs after the Sites build; it starts the Worker with wrangler to do so.
      - name: Enforce performance budgets
        run: pnpm run perf:budget
